<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>数独 · 每天五分钟的数字练习 · 54hrm</title>
<meta name="description" content="干净、有声音、会教你的网页数独。3 / 4 / 6 / 9 宫自由切换，四种难度、每日挑战、教练模式逐步讲推理，无需下载，打开即玩。">
<meta name="theme-color" content="#faf9f6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e6b63'/><text x='50' y='70' font-size='58' font-family='Georgia,serif' text-anchor='middle' fill='%23fff'>9</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="https://www.54hrm.com" title="回到 54hrm.com">
      <span class="logo">数独<em>·</em></span>
      <span class="sub">game.54hrm.com</span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="btnSound" aria-pressed="true" aria-label="音效开关" title="音效">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/>
          <path class="wave" d="M15.6 8.6a4.6 4.6 0 0 1 0 6.8"/>
          <path class="wave2" d="M18.2 6a8 8 0 0 1 0 12"/>
          <path class="mute-x" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnGuide" aria-pressed="false" aria-label="教练模式" title="教练模式：提示讲得更细，答错时给思路">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l2.2 4.6 5 .7-3.6 3.6.9 5-4.5-2.4L7.5 17l.9-5L4.8 8.3l5-.7z"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnHelp" aria-label="玩法与快捷键" title="玩法说明">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="board-panel">
      <div class="board-head">
        <div class="board-title">
          <span id="modeLabel">练习</span>
          <span class="dot"></span>
          <b id="levelLabel">进阶</b>
          <span class="rank" id="rankChip">34 提示</span>
        </div>
        <div class="clock">
          <span class="clock-time" id="clock">00:00</span>
          <button class="icon-btn" id="btnPause" aria-label="暂停" title="暂停 / 继续">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></svg>
          </button>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="数独棋盘"></div>
      </div>

      <div class="pad">
        <div class="pad-nums" id="padNums"></div>
        <div class="pad-actions">
          <button class="key-fn" id="fnNote">笔记</button>
          <button class="key-fn" id="fnCand">候选</button>
          <button class="key-fn" id="fnErase">擦除</button>
          <button class="key-fn" id="fnUndo">撤销</button>
          <button class="key-fn" id="fnHint">提示</button>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="card stats">
        <div class="stat"><b id="statErrors">0</b><span>失误</span></div>
        <div class="stat"><b id="statHints">0</b><span>提示</span></div>
        <div class="stat"><b id="statFilled">0%</b><span>进度</span></div>
      </div>

      <div class="card actions">
        <button class="btn primary" id="btnNew">来一局新的</button>
        <div class="btn-row">
          <button class="btn" id="btnNote">笔记 <kbd>N</kbd></button>
          <button class="btn" id="btnCand">候选 <kbd>C</kbd></button>
          <button class="btn" id="btnUndo">撤销 <kbd>⌘Z</kbd></button>
        </div>
        <button class="btn hint" id="btnHint">卡住了，给我提示</button>
      </div>

      <div class="card sizes" id="sizes"></div>

      <div class="card levels" id="levels"></div>

      <div class="card daily" id="daily"></div>

      <div class="card" id="records">
        <h3>最佳成绩</h3>
        <div id="recordList"></div>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <span>数独 · 无需注册，进度只存在你的浏览器里。</span>
    <span>made by <a href="https://www.54hrm.com">54hrm.com</a></span>
  </footer>
</div>

<div class="coach" id="coach" role="status" aria-live="polite">
  <button class="coach-close" id="coachClose" aria-label="关闭">×</button>
  <div class="coach-tag" id="coachTag">教练</div>
  <div class="coach-text" id="coachText"></div>
  <div class="coach-actions" id="coachActions"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-card" id="modalCard"></div>
</div>

<div class="toast" id="toast"></div>

<script src="sudoku.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
